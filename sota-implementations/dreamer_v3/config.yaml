env:
  backend: gym  # one of: gym, dm_control, custom
  name: Pendulum-v1
  task: null
  seed: 0
  use_seed: true
  max_episode_steps: 200
  # custom backend: "package.module:function" import path of a factory called as
  # factory(seed=..., env_index=..., num_envs=..., **factory_kwargs).
  factory: null
  factory_kwargs: {}
  # Observation layout: a flat vector key and/or an image key (uint8 or [0, 1]
  # float, channels first). null disables the corresponding path.
  vector_key: observation
  pixels_key: null
  # Boolean vector of per-episode milestone flags under next, logged with each
  # completed episode under the given names (asynchronous collection only).
  milestone_key: null
  milestone_names: []

collector:
  backend: sync  # sync: Collector over SerialEnv; async: AsyncBatchedCollector
  num_envs: 1
  frames_per_batch: 200
  total_frames: 5000  # -1 runs until optimization.max_time
  count_reset_records: false
  exploration: random  # one of: random, mode (sync collector only)
  # Asynchronous collection: environments step in their own processes or
  # threads while an inference server batches policy calls.
  policy_device: null  # device of the inference server, null = training device
  env_backend: multiprocessing  # one of: multiprocessing, threading
  # Data exchange with multiprocessing env workers: queue (shared tensors per
  # transition) or shm (one fixed shared slot per env, bounded mappings).
  env_exchange: queue
  inference_max_batch_size: 16
  inference_min_batch_size: 1
  inference_timeout: 0.01
  # Frames buffered ahead of the learner; environments pause when the buffer
  # is full. null keeps environments running at full speed.
  max_pending_frames: null
  compile_policy: false

replay_buffer:
  device: cpu  # null keeps replay on the training device
  # Records kept in total (sync) or per environment stream (async).
  buffer_size: 10000
  batch_size: 16
  seq_len: 16
  online: true
  warmup_factor: 2  # collect (warmup_factor * batch_size * seq_len) frames before training

networks:
  rnn_hidden_dim: 32
  num_categoricals: 4
  num_classes: 4
  unimix: 0.01
  recurrent_model: block_gru
  num_blocks: 8
  dynamics_layers: 1
  prior_layers: 2
  posterior_layers: 1
  norm_eps: 1.0e-4
  # Sizes of the per-observation decoder heads, summing to the observation
  # size. null builds a single head over the whole observation.
  decoder_event_dims: null
  num_reward_bins: 255
  num_value_bins: 255
  hidden_dim: 64
  encoder_layers: 3
  decoder_layers: 3
  reward_layers: 1
  actor_layers: 3
  value_layers: 3
  policy_min_std: 0.1
  policy_max_std: 1.0
  # Image encoder and decoder (env.pixels_key), see DreamerV3ImageEncoder.
  image_depth: 64
  image_mults: [2, 3, 4, 4]
  image_kernel_size: 5
  image_decoder_blocks: 8

optimization:
  device: null       # training device (models, losses, policy). null=auto
  deferred_policy_sync: false
  separate_policy_rng: false
  mixed_precision: false
  # Compile the RSSM recurrence: null, "step" or "scan". "scan" is faster but
  # changes the random stream; see the README.
  compile_rssm: null
  # Number of RSSM steps traced per higher-order scan iteration.
  rssm_scan_unroll: 8
  # Capture the fixed-shape learner forward/backward on CUDA after warmup.
  cudagraph_train_step: false
  # Compile and capture the learner on a fake batch before collection starts.
  # null enables it whenever compile_rssm or cudagraph_train_step is set.
  compile_warmup: null
  # Collect without training for this many seconds first: measures the
  # environment and inference throughput before the learner gates collection.
  collection_warmup_seconds: 0
  lr: 4.0e-5
  optimizer_eps: 1.0e-20
  adaptive_grad_clip: 0.3
  warmup_steps: 1000
  updates_per_batch: 8
  train_ratio: null
  imagination_horizon: 15
  continuation_horizon: 333
  use_reinforce: true
  return_normalization_rate: 0.01
  return_normalization_min_scale: 1.0
  slow_critic_regularization: 1.0
  slow_critic_tau: 0.02
  replay_value_loss_weight: 0.3
  free_bits: 1.0
  dynamic_loss_weight: 1.0
  representation_loss_weight: 0.1
  gamma: 1.0
  lmbda: 0.95
  # Wall-clock budget in seconds; null runs to collector.total_frames.
  max_time: null
  # Checkpoint every N learner updates and once more on graceful shutdown.
  # A relative directory lives below Hydra's run directory; null disables saves.
  checkpoint_dir: checkpoints
  checkpoint_every: 1000
  checkpoint_keep_last: 2
  # Replay tensors can dominate checkpoint size. When false, a resumed run
  # refills replay while preserving model, optimizer, RNG and run counters.
  checkpoint_include_replay: false
  # A checkpoint or rotation directory. null discovers the newest checkpoint
  # in checkpoint_dir when one exists.
  resume_from: null

logger:
  train_every: 200
  eval_every: 500
  eval_episodes: 3
  output_plot: dreamer_v3_pendulum.png
  metrics_jsonl: null
  # Optional experiment tracker: null or wandb (mirrors the JSONL records).
  backend: null
  project: torchrl-dreamer-v3
  entity: null
  # W&B server; null follows WANDB_BASE_URL (which imported libraries may change).
  base_url: null
  exp_name: null
  group: null
  tags: []
  mode: online

hydra:
  job:
    chdir: true
